<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trillo — Tu trillo, ahora mismo.</title>
    <meta name="description" content="Condiciones de senderos, ahora mismo. Reportes de la comunidad más una estimación por lluvia. Gratis. Sin cuenta para mirar." />
    <style>html, body { min-height: 100%; margin: 0; } #root { min-height: 100%; }</style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('trillo:theme');
          if (theme !== 'light' && theme !== 'dark') theme = 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PT95H55N18"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PT95H55N18', { send_page_view: false });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script nomodule>
      document.documentElement.className += ' no-esm';
    </script>
    <p class="legacy-note">
      Trillo abre en Chrome, Firefox, Safari o Edge. / Open Trillo in Chrome, Firefox, Safari, or Edge.
    </p>
    <style>
      .legacy-note { display: none; }
      .no-esm #root { display: none; }
      .no-esm .legacy-note {
        display: block;
        max-width: 28rem;
        margin: 4rem auto;
        padding: 0 1.25rem;
        font: 16px/1.5 Helvetica, Arial, sans-serif;
        color: #efe8d8;
        background: #12180e;
      }
    </style>
  </body>
</html>
